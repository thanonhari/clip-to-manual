services:
  # ====================================================================
  # ClipToManual Web App & API Service
  # ====================================================================
  clip-to-manual:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clip-to-manual
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./manuals:/app/manuals
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

